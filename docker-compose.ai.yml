services:
  sonora-worker:
    build: ./worker
    ports:
      - "8090:8090"
    volumes:
      - ./runtime:/data
    environment:
      SONORA_DATA_ROOT: /data
    restart: unless-stopped

  ace-step:
    build:
      context: ./ace-step
    ports:
      - "8001:8001"
    volumes:
      - ./runtime/ace-step:/root/.cache/huggingface
    restart: unless-stopped
    profiles: ["gpu"]
